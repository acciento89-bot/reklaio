name: Apply Reklaio final Android fixes

on:
  push:
    branches:
      - android/final-fixes-0.4.2
    paths:
      - .github/workflows/_apply-final-android-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/final-fixes-0.4.2
          fetch-depth: 0
      - name: Apply release fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          appjson = Path('mobile/app.json')
          s = appjson.read_text().replace('"version": "0.4.1"', '"version": "0.4.2"')
          appjson.write_text(s)

          pro = Path('mobile/app/pro.tsx')
          s = pro.read_text()
          s = s.replace('import { Stack } from "expo-router";', 'import { Stack, useRouter } from "expo-router";')
          s = s.replace('export default function ProScreen() {\n', 'export default function ProScreen() {\n  const router = useRouter();\n', 1)
          old = '''          headerShadowVisible: false,\n          headerBackButtonDisplayMode: "minimal"\n'''
          new = '''          headerShadowVisible: false,\n          headerBackVisible: false,\n          headerLeft: () => (\n            <Pressable\n              accessibilityRole="button"\n              accessibilityLabel="Zurück"\n              hitSlop={16}\n              onPress={() => {\n                if (router.canGoBack()) router.back();\n                else router.replace("/(app)/profile");\n              }}\n              style={({ pressed }) => [styles.headerBack, pressed && styles.pressed]}\n            >\n              <Text style={styles.headerBackText}>←</Text>\n            </Pressable>\n          )\n'''
          if old not in s:
              raise SystemExit('Reklaio header anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('  screen: {\n', '''  headerBack: {\n    width: 48,\n    height: 44,\n    alignItems: "flex-start",\n    justifyContent: "center"\n  },\n  headerBackText: {\n    color: colors.text,\n    fontSize: 30,\n    fontWeight: "700",\n    lineHeight: 34\n  },\n  screen: {\n''', 1)
          pro.write_text(s)

          purchases = Path('mobile/src/purchases-context.tsx')
          s = purchases.read_text()
          old = '''function messageFromError(cause: unknown) {\n  if (cause && typeof cause === "object" && "message" in cause && typeof cause.message === "string") {\n    return cause.message;\n  }\n  return "Der App-Store konnte gerade nicht erreicht werden.";\n}\n'''
          new = '''function messageFromError(cause: unknown) {\n  const raw = cause && typeof cause === "object" && "message" in cause && typeof cause.message === "string"\n    ? cause.message\n    : "";\n  if (__DEV__ && raw) console.warn("RevenueCat/Store error", raw);\n  const normalized = raw.toLowerCase();\n  if (normalized.includes("configuration") || normalized.includes("offering") || normalized.includes("product")) {\n    return "Google Play kann das Reklaio-Pro-Abo gerade noch nicht laden. Bitte versuche es gleich noch einmal.";\n  }\n  return raw || "Der App-Store konnte gerade nicht erreicht werden.";\n}\n\nasync function getOfferingsWithRetry() {\n  let lastError: unknown = null;\n  for (let attempt = 0; attempt < 2; attempt += 1) {\n    try {\n      return await Purchases.getOfferings();\n    } catch (cause) {\n      lastError = cause;\n      if (attempt === 0) await new Promise((resolve) => setTimeout(resolve, 1200));\n    }\n  }\n  throw lastError;\n}\n'''
          if old not in s:
              raise SystemExit('Reklaio error mapping anchor missing')
          s = s.replace(old, new, 1)
          old = '''    const [info, offerings] = await Promise.all([\n      Purchases.getCustomerInfo(),\n      Purchases.getOfferings()\n    ]);\n    setCustomerInfo(info);\n    setCurrentOffering(offerings.current ?? null);\n'''
          new = '''    const info = await Purchases.getCustomerInfo();\n    setCustomerInfo(info);\n    const offerings = await getOfferingsWithRetry();\n    setCurrentOffering(offerings.current ?? null);\n'''
          if old not in s:
              raise SystemExit('Reklaio offerings anchor missing')
          purchases.write_text(s.replace(old, new, 1))
          PY
          cd mobile
          npm install --ignore-scripts
          npm run typecheck
          cd ..
          git config user.name 'Kamilunavo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile/app.json mobile/app/pro.tsx mobile/src/purchases-context.tsx
          git diff --cached --check
          git commit -m 'fix(android): harden Pro navigation and store loading in 0.4.2'
          git push origin HEAD:android/final-fixes-0.4.2
