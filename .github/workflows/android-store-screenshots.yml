name: Reklaio Android Store Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-store-screenshots.yml"
      - ".github/scripts/capture-reklaio-android-screenshots.sh"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-store-screenshots.yml"
      - ".github/scripts/capture-reklaio-android-screenshots.sh"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies and generate Android project
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install --clean

      - name: Build local debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Capture exact current Reklaio UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/capture-reklaio-android-screenshots.sh"

      - name: Upload authentic screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Reklaio-Play-Store-Screenshots-de-DE
          path: mobile/store/google-play/screenshots/de-DE/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Persist authentic screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'Kamilunavo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile/store/google-play/screenshots/de-DE
          if ! git diff --cached --quiet; then
            git commit -m 'Store authentic Reklaio Android screenshots'
            git push origin HEAD:main
          fi
