name: Reklaio Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build

      - name: Build migration image
        run: docker build --target migrator -t reklaio-migrator-ci .

      - name: Build production image
        run: docker build --target runner -t reklaio-runner-ci .
