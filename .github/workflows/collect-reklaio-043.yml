name: Build and collect Reklaio 0.4.3 AAB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-reklaio-043.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install
      - name: Build signed Android bundle
        run: eas build --platform android --profile production --non-interactive --wait --json > build.json
      - name: Download signed bundle
        run: |
          node -e "const fs=require('fs'); const raw=require('./build.json'); const b=Array.isArray(raw)?raw[0]:raw; fs.writeFileSync('build-url.txt', b.artifacts.buildUrl)"
          curl -L --fail "$(cat build-url.txt)" -o reklaio-0.4.3.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Reklaio-0.4.3-PlayStore
          path: reklaio-0.4.3.aab
          if-no-files-found: error
