name: Reklaio Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reklaio-android-aab
  cancel-in-progress: false

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Repository secret EXPO_TOKEN fehlt."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project link
        run: npm run config:check

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Validate Google Play release contract
        run: node scripts/google-play-preflight.mjs

      - name: Validate Android native project
        run: npx expo prebuild --no-install --platform android

      - name: Verify generated package and API 36 toolchain
        run: |
          grep -R -q 'de.kamilunavo.reklaio' android/app/build.gradle android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml 2>/dev/null
          grep -R -q 'compileSdkVersion.*36\|compileSdk.*36' android 2>/dev/null || {
            echo "Generated Android project does not expose compileSdk 36."
            exit 1
          }
          grep -R -q 'targetSdkVersion.*36\|targetSdk.*36' android 2>/dev/null || {
            echo "Generated Android project does not expose targetSdk 36."
            exit 1
          }

      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive --no-wait
