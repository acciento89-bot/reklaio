name: Reklaio iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reklaio-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build iOS and submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Repository secret EXPO_TOKEN fehlt."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Validate Expo project link
        run: npm run config:check

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Validate iOS native project
        run: npx expo prebuild --no-install --platform ios

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
