name: Reklaio Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npm run config:check

      - name: Guard app, splash and launcher icon parity
        run: |
          node <<'NODE'
          const fs = require('fs');
          const expo = require('./app.json').expo;
          const canonical = expo.icon;
          const refs = {
            appIcon: expo.icon,
            splash: expo.splash?.image,
            webFavicon: expo.web?.favicon,
          };
          if (!canonical) throw new Error('expo.icon is missing');
          for (const [name, value] of Object.entries(refs)) {
            if (value !== canonical) {
              throw new Error(`${name} must use canonical icon ${canonical}, got ${value}`);
            }
          }
          if (expo.android?.adaptiveIcon !== undefined) {
            throw new Error('adaptiveIcon must remain disabled so Android cannot diverge from the iOS icon');
          }
          const file = canonical.replace(/^\.\//, '');
          if (!fs.existsSync(file)) throw new Error(`Canonical icon file missing: ${file}`);
          console.log(`Canonical Reklaio artwork locked to ${canonical} for iOS, Android launcher, splash and favicon.`);
          NODE

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Generate Android and iOS native projects
        run: npx expo prebuild --no-install

      - name: Verify generated Android launcher resources
        run: |
          set -euo pipefail
          manifest=android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:icon="@mipmap/ic_launcher"' "$manifest"
          if grep -Fq 'android:roundIcon=' "$manifest"; then
            echo 'Android must not select a divergent round launcher icon.' >&2
            exit 1
          fi
          test ! -d android/app/src/main/res/mipmap-anydpi-v26
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-$density/ic_launcher.webp"
          done

      - name: Test Android release contract
        run: bash scripts/test-android-release-contract.sh
