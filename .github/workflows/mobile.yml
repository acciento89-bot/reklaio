name: Reklaio Mobile

on:
  push:
    branches: [main, android/final-fixes-0.4.2]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android/final-fixes-0.4.2
          fetch-depth: 0

      - name: Apply final Android fixes
        working-directory: .
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('mobile/app.json')
          app.write_text(app.read_text().replace('"version": "0.4.1"','"version": "0.4.2"'))

          pro = Path('mobile/app/pro.tsx')
          s = pro.read_text()
          if 'const router = useRouter();' not in s:
              s = s.replace('import { Stack } from "expo-router";', 'import { Stack, useRouter } from "expo-router";')
              s = s.replace('export default function ProScreen() {\n', 'export default function ProScreen() {\n  const router = useRouter();\n', 1)
              old = '''          headerShadowVisible: false,\n          headerBackButtonDisplayMode: "minimal"\n'''
              new = '''          headerShadowVisible: false,\n          headerBackVisible: false,\n          headerLeft: () => (\n            <Pressable\n              accessibilityRole="button"\n              accessibilityLabel="Zurück"\n              hitSlop={16}\n              onPress={() => {\n                if (router.canGoBack()) router.back();\n                else router.replace("/(app)/profile");\n              }}\n              style={({ pressed }) => [styles.headerBack, pressed && styles.pressed]}\n            >\n              <Text style={styles.headerBackText}>←</Text>\n            </Pressable>\n          )\n'''
              if old not in s: raise SystemExit('pro header anchor missing')
              s = s.replace(old,new,1)
              s = s.replace('  screen: {\n', '''  headerBack: { width: 48, height: 44, alignItems: "flex-start", justifyContent: "center" },\n  headerBackText: { color: colors.text, fontSize: 30, fontWeight: "700", lineHeight: 34 },\n  screen: {\n''',1)
              pro.write_text(s)

          p = Path('mobile/src/purchases-context.tsx')
          s = p.read_text()
          if 'getOfferingsWithRetry' not in s:
              old = '''function messageFromError(cause: unknown) {\n  if (cause && typeof cause === "object" && "message" in cause && typeof cause.message === "string") {\n    return cause.message;\n  }\n  return "Der App-Store konnte gerade nicht erreicht werden.";\n}\n'''
              new = '''function messageFromError(cause: unknown) {\n  const raw = cause && typeof cause === "object" && "message" in cause && typeof cause.message === "string" ? cause.message : "";\n  if (__DEV__ && raw) console.warn("RevenueCat/Store error", raw);\n  const normalized = raw.toLowerCase();\n  if (normalized.includes("configuration") || normalized.includes("offering") || normalized.includes("product")) {\n    return "Google Play kann das Reklaio-Pro-Abo gerade noch nicht laden. Bitte versuche es gleich noch einmal.";\n  }\n  return raw || "Der App-Store konnte gerade nicht erreicht werden.";\n}\n\nasync function getOfferingsWithRetry() {\n  let lastError: unknown = null;\n  for (let attempt = 0; attempt < 2; attempt += 1) {\n    try { return await Purchases.getOfferings(); }\n    catch (cause) {\n      lastError = cause;\n      if (attempt == 0) await new Promise((resolve) => setTimeout(resolve, 1200));\n    }\n  }\n  throw lastError;\n}\n'''
              if old not in s: raise SystemExit('purchase error anchor missing')
              s = s.replace(old,new,1)
              old2 = '''    const [info, offerings] = await Promise.all([\n      Purchases.getCustomerInfo(),\n      Purchases.getOfferings()\n    ]);\n    setCustomerInfo(info);\n    setCurrentOffering(offerings.current ?? null);\n'''
              new2 = '''    const info = await Purchases.getCustomerInfo();\n    setCustomerInfo(info);\n    const offerings = await getOfferingsWithRetry();\n    setCurrentOffering(offerings.current ?? null);\n'''
              if old2 not in s: raise SystemExit('purchase offering anchor missing')
              p.write_text(s.replace(old2,new2,1))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npm run config:check

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Generate Android and iOS native projects
        run: npx expo prebuild --no-install

      - name: Persist tested fixes
        working-directory: .
        shell: bash
        run: |
          git config user.name 'Kamilunavo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile/app.json mobile/app/pro.tsx mobile/src/purchases-context.tsx
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): harden Pro navigation and store loading in 0.4.2'
            git push origin HEAD:android/final-fixes-0.4.2
          fi
