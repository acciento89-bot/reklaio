name: Reklaio Official Apple App Store Badge
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-apple-app-store-badge.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/replace_text_app_store_with_apple_badge.py
      - name: Build website
        run: |
          npm install
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Use official Apple App Store badge"
            git push
          fi
