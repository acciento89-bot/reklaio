name: Reklaio App Store Download Link
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-app-store-download-link.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/publish_app_store_download_link.py
      - name: Build website
        run: |
          npm install
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add Reklaio App Store download link"
            git push
          fi
