name: Recover Reklaio Android build 9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-android-build-9.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  BUILD_ID: 6a36bc3e-e1b2-45fa-9e40-c54d29e38d23
  PACKAGE_NAME: de.kamilunavo.reklaio
  EXPECTED_VERSION_CODE: '9'
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: android-actions/setup-android@v3
      - name: Locate the already queued EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          eas whoami
          if ! eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"; then
            echo "Direct lookup failed; checking the authenticated Reklaio build list." >&2
            eas build:list --platform android --limit 50 --json --non-interactive > "$RUNNER_TEMP/eas-builds.json"
            jq '[.[] | {id, status, appBuildVersion, createdAt, gitCommitHash}]' "$RUNNER_TEMP/eas-builds.json" >&2
            if ! jq -e --arg id "$BUILD_ID" 'map(select(.id == $id)) | first' "$RUNNER_TEMP/eas-builds.json" > "$RUNNER_TEMP/eas-build.json"; then
              echo "The recorded v9 build ID is not present in the authenticated EAS project." >&2
              exit 1
            fi
          fi
          found=$(jq -r '.id // empty' "$RUNNER_TEMP/eas-build.json")
          status=$(jq -r '.status // empty' "$RUNNER_TEMP/eas-build.json")
          test "$found" = "$BUILD_ID"
          echo "Existing EAS build $found status: $status"
          test "$status" = FINISHED
          code=$(jq -r '(.appBuildVersion // .buildNumber // "") | tostring' "$RUNNER_TEMP/eas-build.json")
          if [ "$code" != "$EXPECTED_VERSION_CODE" ]; then
            echo "Unexpected EAS versionCode: $code (expected $EXPECTED_VERSION_CODE)" >&2
            exit 1
          fi
          eas build:download --build-id "$BUILD_ID" --json --non-interactive > "$RUNNER_TEMP/eas-download.json"
          source_path=$(jq -r '.path // empty' "$RUNNER_TEMP/eas-download.json")
          test -s "$source_path"
          cp "$source_path" reklaio-v9.aab
          test -s reklaio-v9.aab
          echo "AAB_PATH=$(realpath reklaio-v9.aab)" >> "$GITHUB_ENV"
      - name: Verify exact AAB version and signing certificate
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          actual=$(apkanalyzer manifest version-code "$AAB_PATH")
          test "$actual" = "$EXPECTED_VERSION_CODE"
          echo "Verified AAB versionCode: $actual"
          sha256sum "$AAB_PATH"
          keytool -printcert -jarfile "$AAB_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: Reklaio-0.4.3-v9-PlayStore
          path: mobile/reklaio-v9.aab
          if-no-files-found: error
          retention-days: 30
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Upload existing EAS build and verify it in Play
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          edit=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -r '.id')
          bundles=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit/bundles")
          if jq -e --argjson code "$EXPECTED_VERSION_CODE" '.bundles | any(.versionCode == $code)' <<<"$bundles" >/dev/null; then
            echo "$PACKAGE_NAME versionCode $EXPECTED_VERSION_CODE already exists in Google Play"
          else
            body=$(mktemp)
            status=$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$AAB_PATH" "$upload/applications/$PACKAGE_NAME/edits/$edit/bundles?uploadType=media")
            if [[ "$status" != 200 ]]; then cat "$body" >&2; curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit" >/dev/null || true; exit 1; fi
            test "$(jq -r '.versionCode' "$body")" = "$EXPECTED_VERSION_CODE"
          fi
          track_payload=$(jq -nc --arg code "$EXPECTED_VERSION_CODE" '{"track":"internal","releases":[{"name":"Reklaio 0.4.3","status":"completed","versionCodes":[$code]}]}')
          track_body=$(mktemp)
          status=$(curl -sS -o "$track_body" -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$track_payload" "$api/applications/$PACKAGE_NAME/edits/$edit/tracks/internal")
          if [[ "$status" != 2* ]]; then cat "$track_body" >&2; curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit" >/dev/null || true; exit 1; fi
          jq -e --arg code "$EXPECTED_VERSION_CODE" '.track == "internal" and (.releases | any(.status == "completed" and (.versionCodes | index($code))))' "$track_body" >/dev/null
          commit_body=$(mktemp)
          status=$(curl -sS -o "$commit_body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits/$edit:commit")
          if [[ "$status" != 2* ]] && grep -Fq 'changesNotSentForReview' "$commit_body"; then
            status=$(curl -sS -o "$commit_body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits/$edit:commit?changesNotSentForReview=true")
          fi
          if [[ "$status" != 2* ]]; then cat "$commit_body" >&2; exit 1; fi
          fresh=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -r '.id')
          curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$fresh/bundles" | jq -e --argjson code "$EXPECTED_VERSION_CODE" '.bundles | any(.versionCode == $code)' >/dev/null
          curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$fresh/tracks/internal" | jq -e --arg code "$EXPECTED_VERSION_CODE" '.releases | any(.status == "completed" and (.versionCodes | index($code)))' >/dev/null
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$fresh" >/dev/null
          echo "$PACKAGE_NAME versionCode $EXPECTED_VERSION_CODE uploaded to the completed internal track and verified"
