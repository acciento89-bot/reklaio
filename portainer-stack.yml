services:
  reklaio-postgres:
    image: postgres:17-bookworm
    container_name: reklaio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reklaio}
      POSTGRES_USER: ${POSTGRES_USER:-reklaio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - reklaio_postgres_data:/var/lib/postgresql/data
    networks:
      - reklaio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reklaio} -d ${POSTGRES_DB:-reklaio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  reklaio-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: reklaio-migrate
    restart: "no"
    depends_on:
      reklaio-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reklaio}:${POSTGRES_PASSWORD}@reklaio-postgres:5432/${POSTGRES_DB:-reklaio}
    networks:
      - reklaio

  reklaio-upload-init:
    image: alpine:3.22
    container_name: reklaio-upload-init
    restart: "no"
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "mkdir -p /uploads && chown -R 1001:1001 /uploads && chmod -R u+rwX,go-rwx /uploads"]
    volumes:
      - reklaio_uploads:/uploads

  reklaio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: reklaio
    restart: unless-stopped
    init: true
    depends_on:
      reklaio-migrate:
        condition: service_completed_successfully
      reklaio-upload-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      BASE_URL: ${BASE_URL:-https://reklaio.de}
      DATABASE_URL: postgresql://${POSTGRES_USER:-reklaio}:${POSTGRES_PASSWORD}@reklaio-postgres:5432/${POSTGRES_DB:-reklaio}
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOAD_DIR: /app/uploads
    volumes:
      - reklaio_uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - caddy
      - reklaio
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  reklaio_postgres_data:
  reklaio_uploads:

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK}
  reklaio:
    name: reklaio
